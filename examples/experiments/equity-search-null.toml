# The same search on the null twin (no planted signal). A sound search reports nothing here: the best candidate sits
# near the expected maximum of the null trials, walk-forward selection earns about zero, PBO is near one half.
#   chairlift search examples/experiments/equity-search-null.toml
study  = "../studies/equity_ls.py:study"
reason = "the same search on the null twin: there is nothing to find"

[params]
signal_ic = 0.0

[search]
sampler = "random"
budget  = 16
seed    = 1

[search.params]
alpha  = { low = 1e-4, high = 10.0, log = true }
q      = [0.05, 0.1, 0.2]
leaves = { low = 4, high = 32, int = true }
