[project]
name = "chairlift"
version = "0.0.1"
description = "A machine-learning research pipeline in which the research protocol is code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "msgspec>=0.22",
    "numpy>=1.26",
    "platformdirs>=4.12",
    "polars>=1.21,<2",
    "rich>=13",
    "tomli-w>=1.2",
]

[project.scripts]
chairlift = "chairlift.run.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "hypothesis>=6.168.3",
    "prek>=0.5.4",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "syrupy>=6.1.1",
    "ty>=0.0.84",
    "typos>=1.50.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # × − → are intentional in docs and output

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --strict-markers --cov=chairlift --cov-branch --cov-report=term-missing:skip-covered"  # add -n 4 for xdist
markers = [
    "property: hypothesis invariants (tests/properties)",
    "golden: content snapshots of whole pipelines (tests/golden)",
    "walkthrough: debug walkthroughs, asserted (tests/walkthroughs)",
    "slow: needs real data or minutes of compute",
]

[tool.ruff.format]
exclude = ["plans/**", "docs/**"]

[tool.basedpyright]
include = ["src", "tests", "debug_walkthroughs"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false
reportUnknownMemberType = false  # polars' dynamic expression API
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
source = ["chairlift"]
branch = true
