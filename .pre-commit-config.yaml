# Run by prek (drop-in, Rust): `uv run prek install` once per clone; `uv run prek run --all-files` on demand.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]  # CI's `ruff format --check .` formats code blocks in markdown too
      - id: basedpyright
        name: basedpyright (strict on src)
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]
